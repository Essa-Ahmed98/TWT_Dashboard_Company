<div class="bpt">
  <div class="info-card">
    <div class="info-card__header">
      <i class="pi pi-briefcase"></i>
      {{ 'PILGRIM_DETAIL.BAG_PATH.TITLE' | translate }}
    </div>

    @if (loading()) {
      <div class="bpt__state">
        <i class="pi pi-spin pi-spinner"></i>
        <p>{{ 'PILGRIM_DETAIL.BAG_PATH.LOADING' | translate }}</p>
      </div>
    } @else if (error()) {
      <div class="bpt__state bpt__state--error">
        <i class="pi pi-exclamation-circle"></i>
        <p>{{ 'PILGRIM_DETAIL.BAG_PATH.ERROR' | translate }}</p>
      </div>
    } @else if (points().length === 0) {
      <div class="bpt__state">
        <i class="pi pi-map"></i>
        <p>{{ 'PILGRIM_DETAIL.BAG_PATH.NO_DATA' | translate }}</p>
      </div>
    } @else {
      <div #bagMapEl class="bpt__map"></div>
    }
  </div>
</div>
